[project]
name = "lingyu"
version = "0.8.14"
description = "灵语（Lingyu）—— 面向 AI Agent 的微信桌面自动化服务"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
lingyu = "lingyu.server:main"
lingyu-desktop = "lingyu.desktop:run"

[project.optional-dependencies]
# 微信桌面自动化所需的运行时依赖（仅在目标 Windows 环境安装）。
wechat = [
    "loguru>=0.7",
    "wechatauto-replica==1.2.2.6",
    "wxauto4==41.1.7",
    "uiautomation==2.0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 桥接层与前端资源以数据文件形式随包分发：桥接层运行期按路径加载（可单独热替换），
# 前端静态文件由 pywebview 直接读取。
lingyu = ["bridge/*.py", "webui/*"]
