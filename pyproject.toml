[project]
name = "lingyu"
version = "0.8.13"
description = "灵语（LingYu）- 面向通用 AI Agent 的微信桌面自动化工具服务"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[project.scripts]
lingyu = "lingyu.server:main"
lingyu-desktop = "lingyu.desktop:run"

[project.optional-dependencies]
# 微信桌面自动化所需的运行时依赖（仅在目标 Windows 环境安装）。
# 适配层通过内置的 wechat_bridge 调用这些库，故需其依赖可用。
wechat = [
    "loguru>=0.7",
    "wechatauto-replica==1.2.2.6",
    "wxauto4==41.1.7",
    "uiautomation==2.0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
